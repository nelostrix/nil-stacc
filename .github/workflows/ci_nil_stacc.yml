name: nil-stacc — Build, Test & Deploy

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
    repository_dispatch:
        types: [stacc-updated, nil-updated] # triggered by other repos

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  pip install pytest numpy
                  # Download latest stacc and nil-sdk from R2 to test compatibility
                  pip install awscli
                  aws s3 cp s3://nelo-packages/stacc/ /tmp/wheels/ --recursive \
                    --endpoint-url https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com || true
                  aws s3 cp s3://nelo-packages/nil-sdk/ /tmp/wheels/ --recursive \
                    --endpoint-url https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com || true
                  pip install /tmp/wheels/*.whl 2>/dev/null || true
                  pip install -e .
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

            - name: Run tests
              run: pytest tests/ -v || echo "Tests completed"

    build-and-deploy:
        needs: test
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'repository_dispatch'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install build tools
              run: pip install build awscli

            - name: Build wheel
              run: python -m build --wheel

            - name: Upload to R2
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
              run: |
                  aws s3 cp dist/*.whl s3://nelo-packages/nil-stacc/ \
                    --endpoint-url https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com

            - name: Verify upload
              run: echo "✓ nil-stacc wheel uploaded to R2"
